[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sma-glove"
version = "0.1.0"
description = "SMA 글러브(Arduino) 시리얼 통신 + URDF 시각화 파이썬 패키지"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "pybullet>=3.2.5",
]

[tool.setuptools.packages.find]
include = ["sma_glove*"]

[tool.setuptools.package-data]
sma_glove = ["urdf/*.urdf"]
